name: Pages

# Builds the plugin site from site/catalog.json plus live npm data into _site/
# and deploys it through GitHub Actions. The Pages source MUST be set to
# "GitHub Actions" in the repository settings; "Deploy from a branch" would
# serve a Jekyll-rendered root README instead of this site.
#
# A push to main is the only automatic trigger. The publish workflow's own
# `commit` step pushes to main, which triggers this workflow naturally. Do not
# add a `workflow_run` trigger: a Pages deployment can only consume the
# `github-pages` artifact that *its own* run uploaded, so a `workflow_run`
# child cannot run `deploy-pages` at all (GitHub rejects it with "No artifacts
# named github-pages were found"), and two push-triggered runs would race the
# same artifact name. Ordering after publish is therefore enforced *inside*
# this run, not via a second trigger: the "Wait for npm registry freshness"
# step blocks until the packument CDN's `dist-tags.latest` has caught up with
# the versions the publish flow just committed to index.json, so the site build
# reads the freshest version instead of a stale replica.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:test
      # Block until the packument CDN reports the version the publish flow just
      # committed to index.json as `dist-tags.latest`. On an ordinary
      # code-only push this passes on the first poll (index.json already equals
      # the live registry); only a just-published push adds wait time. A
      # lingering lag is non-fatal: it warns and builds the latest available
      # version, and the next publish re-triggers this flow to self-heal.
      - name: Wait for npm registry freshness
        run: node site/fresh.mjs --timeout 300000 --poll 15000
      - run: pnpm site:build
      # render.mjs writes _site/.nojekyll; assert it so a regression cannot
      # silently let Jekyll take over the deployed site.
      - name: Verify static site output
        run: |
          test -f _site/index.html
          test -f _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # deploy-pages looks the artifact up by name through GitHub's API. Keeping
  # the upload in an earlier job puts real distance between the write and that
  # lookup, avoiding the artifact-metadata visibility race of a single job.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
